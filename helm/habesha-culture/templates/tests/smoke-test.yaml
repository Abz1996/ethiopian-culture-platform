apiVersion: v1
kind: Pod
metadata:
  name: {{ include "habesha.name" . }}-smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS http://{{ include "habesha.name" . }}:{{ .Values.service.port }}/healthz &&
          curl -fsS http://{{ include "habesha.name" . }}:{{ .Values.service.port }}/api/dishes/injera
